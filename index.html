<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Where should we eat?</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<header><button id="ourListTop">OUR LIST</button><span>♡</span></header>
<main>
<section id="picker" class="page active"><div class="stationery"><img class="lace" src="assets/lace.png"><div class="clip"></div><article class="paper">
<div id="home"><p class="micro">DATE NIGHT ROULETTE</p><h1>Where should<br>we eat?</h1><div class="cutlery-art" aria-hidden="true">
        <div class="fork-art"><span></span><span></span><span></span><span></span></div>
        <div class="knife-art"></div>
        <div class="ribbon-art"><i></i><b></b></div>
      </div>
      <button class="primary" id="choose">CHOOSE FOR US <b>→</b></button><div class="tagline"><span></span><p>good food<br>happier days</p><span></span></div></div>
<div id="result" class="hidden"><p class="micro">TONIGHT'S PICK</p><h2 id="pick"></h2><div id="trail"></div><button class="primary" id="again">PICK AGAIN <b>→</b></button><p id="remaining"></p><button class="reset hidden" id="reset">START A NEW SESSION</button></div>
</article></div><button id="ourListBottom" class="listLink">OUR LIST ↗</button></section>
<section id="list" class="page"><article class="listPaper"><div class="listHead"><div><p class="micro">OUR SHARED ARCHIVE</p><h3>Our List</h3></div><button id="close">×</button></div>
<form id="add"><input id="name" placeholder="Add a restaurant…" maxlength="60"><button>＋</button></form><div class="counts"><span id="tryCount"></span><span id="visitCount"></span></div>
<p class="sectionTitle">TO VISIT</p><div id="toVisit"></div><p class="sectionTitle visitedTitle">VISITED</p><div id="visited"></div></article></section>
</main><script src="app.js"></script></body></html>
